name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar (TypeScript + Vite)
        run: npm run build

  scripts:
    name: Scripts de publicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sintaxis y permisos de ejecución
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
            test -x "$f" || { echo "$f no es ejecutable"; exit 1; }
          done
